/* Layout: hero with rotating city + slogan -> "what do you need" grid: 3 live service tiles (each its own 3D scene, expands to full width) + one slot split into 2 locked "coming soon" tiles */
:root{

.hero{position:relative;padding-block:28px 56px;display:grid;gap:14px}

  h+=[].concat(M.note).map(n=>`<p class="note">${L[n]}</p>`).join("");
  if(M.test)h+=`<button class="testbtn" aria-pressed="${S.test}"><span><span>${L.testT}</span><em>${L.testD}</em></span><span style="font-size:20px">↓</span></button>`+(S.test?`<div class="card terms drop"><b>${L.termsT}</b><ul>${L.terms.map(t=>`<li>${t}</li>`).join("")}</ul></div>`:"");
  h+=`<div class="tot${S.touched?" drop":" hide"}"><div><span class="label">${L.totalP}</span><b class="sum"></b><small class="pn">${L.priceNote}</small>${c.kv&&m==="pro"?`<a class="kvl" href="#kv">${K[lang].kvLink}</a>`:""}</div><a class="btn pri cta" target="_blank" rel="noopener"></a></div>`;
  box.innerHTML=h;calcCfg(st)}
function calcCfg(st){const k=st.svc.k,c=CFG[k],L=C[lang],S=st.c,m=S.who,M=c[m],test=S.test&&m==="pro",val=it=>test&&it.t!=null?it.t:it.p;
  let sum=0,area=0,rate=0,hrs=0,rateH=0;const lines=[];
  if(m==="me"){sum+=M.base.p;lines.push(tr(M.base.n)+" + "+M.inc.slice(0,2).map(x=>tr(x.n)).join(" + "))}
  M.sec.forEach((sec,i)=>sec.items.forEach(it=>{const id=m+it.id;
    if(sec.radio){if(S.radio[m+i]===it.id){if(it.h!=null)rateH=test&&it.th!=null?it.th:it.h;else if(it.r!=null)rate=test&&it.tr!=null?it.tr:it.r;else sum+=val(it);lines.push(tr(it.n))}}
    else if(it.ty==="hours"){hrs=S.qty[id];lines.push(hrs+L.hU)}
    else if(it.ty==="area"){area=S.qty[id];lines.push(area+" m²")}
    else if(it.ty==="qty"){const q=S.qty[id];if(q){sum+=q*val(it);lines.push(`${tr(it.n)} ×${q}`)}}
    else if(it.ty==="chk"&&S.chk.has(id)){sum+=val(it);lines.push(tr(it.n))}}));
  if(area&&rate)sum+=Math.round(area*rate/5)*5;
  if(hrs&&rateH)sum+=hrs*rateH;
  if(M.min)sum=Math.max(sum,M.min[test?1:0]);
  if(test)lines.push("TEST");
  const box=$(".cfgx",st.el);$(".sum",box).textContent=eur(sum);const a=$(".cta",box);a.textContent=L.goWA;
  a.href=`https://wa.me/${WA}?text=`+encodeURIComponent(`KaiMobil – ${T[lang].svc[k].t} (${m==="me"?L.me:L.pro}): ${lines.join(", ")} – ${eur(sum)}`)}
stages.forEach(st=>{st.c=cstate(st.svc.k);if(!st.c)return;const box=$(".cfgx",st.el);
  const touch=()=>{if(!st.c.touched){st.c.touched=true;const t=$(".tot",box);if(t){t.classList.remove("hide");t.classList.add("drop")}}};
  box.addEventListener("click",e=>{const w=e.target.closest("[data-who]");if(w){st.c.who=w.dataset.who;st.c.touched=true;renderCfg(st);return}
    if(e.target.closest(".testbtn")){st.c.test=!st.c.test;st.c.touched=true;
      if(st.c.test){const M=CFG[st.svc.k].pro;if(M)M.sec.forEach((sec,i)=>{if(!sec.radio)return;const cur=sec.items.find(x=>x.id===st.c.radio["pro"+i]);if(cur&&cur.noTest)st.c.radio["pro"+i]=sec.items.find(x=>!x.noTest).id})}
      renderCfg(st);return}
    const b=e.target.closest(".stp button");if(b){const sp=b.parentElement,id=sp.dataset.q,stp=+(sp.dataset.step||1),d=b.textContent==="+"?stp:-stp;st.c.qty[id]=Math.max(+(sp.dataset.min||0),Math.min(+sp.dataset.max,st.c.qty[id]+d));$("output",sp).textContent=st.c.qty[id]+(sp.dataset.unit||"");touch();calcCfg(st)}});
  box.addEventListener("change",e=>{const t=e.target;if(t.dataset.c){t.checked?st.c.chk.add(t.dataset.c):st.c.chk.delete(t.dataset.c)}if(t.dataset.sec)st.c.radio[t.dataset.sec]=t.value;touch();calcCfg(st)})});

/* ================= language from the phone ================= */
function detectLang(){try{const q=new URLSearchParams(location.search).get("lang");if(T[q])return q}catch(e){}
  try{const v=localStorage.getItem("kmLang");if(T[v])return v}catch(e){}
  const l=String((navigator.languages&&navigator.languages[0])||navigator.language||"fi").toLowerCase();
  if(l.startsWith("fi"))return"fi";if(/^(ru|uk|be)/.test(l))return"ru";return"en"}

/* rotating words */
function rotor(el,items,ms){clearInterval(el._t);let i=0;el.innerHTML=items.map((t,k)=>`<span class="${k?"":"on"}">${t}</span>`).join("");
  if(reduced)return;el._t=setInterval(()=>{const sp=el.children,prev=i;sp[prev].className="out";i=(i+1)%sp.length;sp[i].className="on";setTimeout(()=>{if(sp[prev].className==="out")sp[prev].className=""},800)},ms)}

function apply(){const L=T[lang];document.documentElement.lang=lang;
  $$("[data-i]").forEach(e=>{const v=L[e.dataset.i];if(typeof v==="string")e.textContent=v});
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("#wa").href=`https://wa.me/${WA}?text=`+encodeURIComponent("KaiMobil: ");

    $(".tag",el).textContent=L.cat[st.svc.cat];$(".season",el).textContent=v.season;$("h3",el).textContent=v.t;$(".d",el).textContent=v.d;
    $(".from",el).textContent=st.svc.lock?"":`${L.from} ${st.svc.from} €`;
